name: Profils Synergrid d une nouvelle annee

on:
  schedule:
    - cron: "0 7 5 1 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install pyxlsb

      - name: Extraire les profils d une nouvelle annee si besoin
        run: python collecte/indices_profil.py extraire | tee rapport.json

      - name: Calculer les indices ponderes
        run: python collecte/indices_profil.py publier | tee -a rapport.json

      - name: Reconstruire la base publiee
        run: python scripts/construire.py

      - name: Resume
        run: |
          echo '## Indices ponderes' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat rapport.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Versionner
        run: |
          rm -f rapport.json
          git config user.name "collecte-bot"
          git config user.email "collecte-bot@users.noreply.github.com"
          git add collecte/data data
          git diff --staged --quiet || git commit -m "profils: indices ponderes du $(date -u +%F)"
          git push
