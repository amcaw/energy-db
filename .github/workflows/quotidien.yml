name: Collecte quotidienne

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parametres d indexation Engie
        id: engie
        continue-on-error: true
        run: python collecte/engie.py | tee -a rapport.json

      - name: Day-ahead belge electricite
        run: python collecte/epex.py collect | tee -a rapport.json

      - name: Recoupement SMARD
        continue-on-error: true
        run: python collecte/smard.py controle | tee -a rapport.json

      - name: Gaz belge au comptant
        run: python collecte/gaz.py collect | tee -a rapport.json

      - name: Publier les mois ZTP EGSI complets
        run: python collecte/gaz.py publier | tee -a rapport.json

      - name: Gaz neerlandais au comptant
        run: python collecte/ttf.py collect | tee -a rapport.json

      - name: Publier les mois TTF complets
        run: python collecte/ttf.py publier | tee -a rapport.json

      - name: Outil de lecture des PDF
        continue-on-error: true
        run: sudo apt-get install -y --no-install-recommends poppler-utils

      - name: TTF Heren publie par Luminus et Eneco
        id: heren
        continue-on-error: true
        shell: bash
        run: python collecte/heren.py publier | tee -a rapport.json

      - name: Cotations a terme
        run: python collecte/terme.py collect | tee -a rapport.json

      - name: Indices ponderes par profil
        run: python collecte/indices_profil.py publier | tee -a rapport.json

      - name: Tarifs du comparateur CWaPE
        id: cwape
        continue-on-error: true
        shell: bash
        run: python collecte/comparateurs.py tarifs wallonie | tee -a rapport.json

      - name: Tarifs du comparateur Brugel
        id: brugel
        continue-on-error: true
        shell: bash
        run: python collecte/comparateurs.py tarifs bruxelles | tee -a rapport.json

      - name: Reconstruire la base publiee
        run: python scripts/construire.py | tee -a rapport.json

      - name: Controler la coherence
        run: python scripts/verifier.py | tee -a rapport.json

      - name: Resume
        run: |
          echo '## Collecte du' $(date -u +%F) >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat rapport.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Versionner
        run: |
          rm -f rapport.json
          git config user.name "collecte-bot"
          git config user.email "collecte-bot@users.noreply.github.com"
          git add collecte/data data
          git diff --staged --quiet || git commit -m "releve du $(date -u +%F)"
          git push

      - name: Signaler une anomalie de source
        if: steps.engie.outcome == 'failure'
        run: echo "::warning::la page Engie est devenue inintelligible, voir le resume"

      - name: Signaler un echec de la collecte CWaPE
        if: steps.cwape.outcome == 'failure'
        run: echo "::warning::la collecte CWaPE (gaz ou electricite) a echoue ou les prix ne sont plus lineaires, voir le resume"

      - name: Signaler un echec du releve Heren
        if: steps.heren.outcome == 'failure'
        run: echo "::warning::le releve TTF Heren (PDF Luminus ou Eneco) a echoue ou les deux sources divergent, voir le resume"

      - name: Signaler un echec de la collecte Brugel
        if: steps.brugel.outcome == 'failure'
        run: echo "::warning::la collecte Brugel (gaz ou electricite) a echoue ou les prix ne sont plus lineaires, voir le resume"
